<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar</title>
</head>
<body>
<a href="index.html">Voltar</a>
<form id="cadastro">
    <div>
        <label for="nome" >Nome:</label>
        <input id="nome" type="nome">
    </div>
        <label for="sobrenome" >Sobrenome:</label>
        <input id="sobrenome" type="sobrenome">
    <div>
        <label for="idade">Idade</label>
        <input id="idade" type="number" min="14" max="100">
    </div>
        <label for ="altura">Altura em metros:</label>
        <input id="altura" type="number" step="0.01"
        min="1.20" max="2.30">
    <div>
        <label for="peso">Peso:</label>
        <input id="peso" type="number" step="0.1" min="20.0" max="400.0">
    </div>
    <div>
        <label>Sexo:</label>

        <input id="masculino" type="radio" name="sexo" value="1">
        <label for="masculino">Masculino</label>
        <input id="feminino" type="radio" name="sexo" value="2">
     <label for="feminino">Feminino</label>
    </div>
</form>
</body>
</html>
